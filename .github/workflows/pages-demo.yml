name: BlockHub UI demo

on:
  push:
    branches: [github-pages-demo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blockhub-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: clients/web/demo/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: clients/web/demo
      - run: npm run build
        working-directory: clients/web/demo
      - run: CHROME_PATH="$(command -v google-chrome)" npm test
        working-directory: clients/web/demo
      - name: Preserve failed browser proof
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-browser-proof
          path: .tmp/pages-proof/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: clients/web/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
